<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e4edf0" />
    <meta name="description" content="3D 黑洞吞噬游戏，支持自由漫游、限时挑战和 2–4 人好友联机。" />
    <title>小小黑洞</title>
  </head>
  <body>
    <main id="app">
      <div id="world" aria-label="3D 小镇游戏场景"></div>
      <header class="topbar">
        <a class="brand" href="./" aria-label="小小黑洞首页"><span class="brand-hole"></span><span>小小黑洞</span></a>
        <div id="clock" class="clock" hidden><span>剩余时间</span><strong>02:00</strong></div>
        <div class="top-actions"><span class="mode"><i></i><span id="mode-label">自由漫游</span></span><button id="sound" class="icon-button" aria-label="开启音效" title="开启音效"></button><button id="pause" class="icon-button" aria-label="暂停游戏" title="暂停游戏" disabled hidden></button></div>
      </header>
      <section id="intro" class="intro" aria-label="游戏模式与房间">
        <div class="mode-picker" role="group" aria-label="选择游戏模式"><button data-mode="free" aria-pressed="true">自由漫游</button><button data-mode="timed" aria-pressed="false">限时挑战</button><button data-mode="online" aria-pressed="false">好友联机</button></div>
        <label id="map-choice" class="map-choice" hidden>选择地图<select id="map-select"></select></label>
        <button id="start" class="primary">开始吞噬 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
        <span id="mode-note" class="intro-note">无时间限制，清空地图后结算。</span>
        <section id="network-form" hidden aria-label="创建或加入好友房间">
          <label for="nickname">你的昵称</label><input id="nickname" maxlength="12" placeholder="输入昵称" autocomplete="nickname" />
          <div class="room-mode-picker" role="group" aria-label="好友房玩法"><button data-room-mode="race" aria-pressed="true">120 秒竞赛</button><button data-room-mode="coop" aria-pressed="false">合作清空</button></div>
          <button id="create-room" class="primary">创建好友房</button>
          <div class="join-row"><input id="room-code" maxlength="8" placeholder="8 位房间号" aria-label="房间号" autocapitalize="characters" autocomplete="off" spellcheck="false" /><button id="join-room" class="secondary">加入</button></div>
          <p id="network-status" role="status" aria-live="polite">2–4 人，分享房间链接就能一起玩。</p>
        </section>
      </section>
      <section id="room-panel" class="room-panel" hidden aria-label="好友房间">
        <div class="room-panel-heading"><h2>好友房间</h2><button id="leave-lobby" class="text-button">离开</button></div>
        <p id="room-description"></p><div class="invite-row"><strong id="invite-code"></strong><button id="copy-invite" class="secondary">复制邀请链接</button></div>
        <input id="invite-link" readonly aria-label="邀请链接" hidden />
        <ol id="lobby-players" class="player-list"></ol>
        <button id="room-start" class="primary" disabled>等待朋友加入</button><p id="lobby-note" class="room-note">房主开启比赛，所有人同步出发。</p>
      </section>
      <aside id="leaderboard" class="leaderboard" aria-label="实时排名" hidden><h2>吞噬排名</h2><ol id="ranking-list" class="player-list"></ol></aside>
      <div id="paused-banner" class="paused-banner" role="status" hidden></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="combo" class="combo" aria-hidden="true"></div>
      <footer class="bottom-bar" hidden>
        <div class="controls-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="2" width="12" height="20" rx="6"/><path d="M12 2v7M6 9h12"/></svg><span class="desktop-hint">按住拖动移动<small>也可使用 W A S D / 方向键</small></span><span class="mobile-hint">单指拖动移动</span></div>
        <section id="progress" class="progress-panel" aria-label="吞噬进度">
          <div class="progress-heading"><span class="level-badge" id="level-number">1</span><div><strong id="level-name">小小胃口</strong><span id="edible-label">可以吞噬：石子、路锥、灌木</span></div><span id="size">2.4<span> m</span></span></div>
          <div class="progress-track"><div id="progress-fill"></div></div>
          <div class="progress-meta"><span>小镇清空进度</span><span><b id="eaten">0</b> / <span id="total">0</span></span></div>
        </section>
        <div class="bottom-actions"><button id="home" class="text-button" hidden>返回首页</button><button id="restart" class="text-button" title="重新生成小镇"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg><span>重新开始</span></button></div>
      </footer>
      <div id="joystick" aria-hidden="true"><span></span></div>
      <dialog id="pause-dialog"><form method="dialog"><span class="dialog-orbit"></span><h2>游戏已暂停</h2><p>移动和计时已暂停。</p><button class="primary">继续吞噬</button></form></dialog>
      <dialog id="restart-dialog"><h2>重新开始？</h2><p>重新开始将重置本轮进度。</p><div class="dialog-actions"><button id="cancel-restart" class="secondary">继续这局</button><button id="confirm-restart" class="primary">重新开始</button></div></dialog>
      <dialog id="win-dialog"><span class="dialog-orbit"></span><h2 id="result-title">游戏结束</h2><p id="win-description"></p><ol id="result-ranking" class="player-list"></ol><button id="play-again" class="primary">再来一局</button><button id="stay" class="text-button">返回首页</button></dialog>
      <dialog id="disconnect-dialog"><h2>房间已断开</h2><p id="disconnect-message"></p><button class="primary" id="disconnect-home">返回首页</button></dialog>
      <div id="loading" class="loading"><span class="brand-hole"></span><p>正在加载场景…</p></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
